version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg_moderator_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Монтируем директорию с логами для доступа к ним с хоста
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge

